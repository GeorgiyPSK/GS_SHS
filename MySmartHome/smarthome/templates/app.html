<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>GS Smart</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='themes.css') }}">
<script src="{{ url_for('static', filename='theme.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>

<div class="header">
  <h1>🏠 Умный дом</h1>
  <select id="roomSelect"><option value="">Общий план</option></select>
  <select id="themeSelect" title="Тема оформления"></select>
  <span id="status" class="status offline">офлайн</span>
  <a href="/logout" class="header button" style="text-decoration:none;padding:.45rem .9rem;">Выйти🚪</a>
</div>

<div class="main-tabs">
  <button id="tab-plans" class="active" onclick="switchTab('plans')">🗺️ План</button>
  <button id="tab-devices" onclick="switchTab('devices')">🧩 Устройства</button>
</div>

<!-- ============== План ============== -->
<div id="view-plans">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="planWrap">
    <div class="plan-empty">Загрузка…</div>
  </div>
</div>

<!-- ============== Устройства ============== -->
<div id="view-devices" style="display:none;">
  <div class="rooms-sections" id="roomsSections"></div>
</div>

<div class="modal-overlay" id="cf-modal-overlay"
     onclick="if (event.target === this) closeCustomFieldModal()">
  <div class="modal" id="cf-modal-content">
    <button class="modal-close" onclick="closeCustomFieldModal()" title="Закрыть">✕</button>
    <div style="padding:1.2rem;">
      <h3 id="cf-modal-title" style="margin:0 0 .8rem;">Поле</h3>
      <div id="cf-modal-body"></div>
      <div class="actions" style="margin-top:1rem;display:flex;gap:.4rem;justify-content:flex-end;">
        <button onclick="closeCustomFieldModal()">Отмена</button>
        <button class="primary" id="cf-modal-apply">💾 Применить</button>
      </div>
    </div>
  </div>
</div>
<!-- ============== Модалка графика ============== -->
<div class="modal-overlay" id="chart-modal-overlay"
     onclick="if (event.target === this) closeChartModal()">
  <div class="modal" style="max-width:960px; width:100%;">
    <button class="modal-close" onclick="closeChartModal()" title="Закрыть">✕</button>
    <div style="padding:1.2rem;">
      <h3 id="chart-modal-title" style="margin:0 0 .6rem;">📊 График</h3>

      <!-- Серии -->
      <div style="margin-bottom:.5rem;">
        <div style="font-size:.85rem; opacity:.85; margin-bottom:.3rem;">Серии:</div>
        <ul id="chart-modal-series"
            style="list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:.3rem; max-height:160px; overflow-y:auto;"></ul>

        <div style="display:flex; gap:.4rem; flex-wrap:wrap; align-items:center; margin-top:.5rem;">
          <select id="chart-modal-device" onchange="chartModalRefreshFields()"
                  style="flex:1; min-width:180px;">
            <option value="">— устройство —</option>
          </select>
          <select id="chart-modal-field" style="flex:1; min-width:120px;"></select>
          <button class="btn small gray" onclick="chartModalSeriesAdd()">➕ Добавить</button>
        </div>
      </div>

      <!-- Период -->
      <div style="display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; margin:.6rem 0;">
        <label>С:
          <input type="datetime-local" id="chart-from" onchange="reloadChartSeries()">
        </label>
        <label>По:
          <input type="datetime-local" id="chart-to" onchange="reloadChartSeries()">
        </label>
        <label>Точек:
          <input type="number" id="chart-max-points" min="50" max="5000" step="50"
                 value="1000" style="width:90px;" onchange="reloadChartSeries()">
        </label>
        <div style="display:flex; gap:.3rem;">
          <button class="btn small gray" onclick="chartQuickRange(1)">1ч</button>
          <button class="btn small gray" onclick="chartQuickRange(24)">24ч</button>
          <button class="btn small gray" onclick="chartQuickRange(24*7)">7д</button>
          <button class="btn small gray" onclick="chartQuickRange(24*30)">30д</button>
        </div>
      </div>

      <div style="position:relative; height:420px;">
        <canvas id="chart-canvas"></canvas>
      </div>

      <div id="chart-status" style="font-size:.85rem; opacity:.75; margin-top:.4rem;"></div>
    </div>
  </div>
</div>
<!-- ============== Модалка ============== -->
<div id="modal">
  <button class="close" onclick="closeModal()">✕</button>
  <h3 id="mTitle">Устройство</h3>
  <div class="sub" id="mSub"></div>
  <div id="mBody"></div>
  <div class="btns" id="mBtns"></div>
</div>

<div id="toast"></div>

<script src="{{ url_for('static', filename='constants.js') }}"></script>
<script src="{{ url_for('static', filename='state.js') }}"></script>
<script src="{{ url_for('static', filename='core.js') }}"></script>
<script src="{{ url_for('static', filename='ui/devices.js') }}"></script>
<script src="{{ url_for('static', filename='ui/charts.js') }}"></script>
<script src="{{ url_for('static', filename='JS_for_app_mode.js') }}"></script>
</body>
</html>
